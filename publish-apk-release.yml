name: Publish Virendra Calculator APK Release

# Trigger a fresh build once when this workflow is added, then publish every
# successful signed APK build to the GitHub Releases 'Latest' download page.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Virendra Calculator Release APK
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  start-build:
    name: Start latest APK build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run the existing signed APK build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish-apk:
    name: Publish signed APK to latest Release
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APK from completed build
        uses: actions/download-artifact@v4
        with:
          name: Virendra-Calculator-Release-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release

      - name: Get version from the signed APK filename
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release/Virendra-Calculator-v*-release.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one signed APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apk="${apks[0]}"
          filename="$(basename "$apk")"
          version="${filename#Virendra-Calculator-v}"
          version="${version%-release.apk}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid APK version: $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      - name: Create or update the public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Virendra Calculator ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
