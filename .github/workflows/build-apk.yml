name: Build Virendra Calculator Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'version.json'
      - 'icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Prepare compatible signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 missing"
            exit 1
          fi

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_STORE_PASSWORD missing"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::ANDROID_KEY_ALIAS missing"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEY_PASSWORD missing"
            exit 1
          fi

          OLD_KEYSTORE="$RUNNER_TEMP/virendra-release-original.jks"
          NEW_KEYSTORE="$RUNNER_TEMP/virendra-release-compatible.p12"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > "$OLD_KEYSTORE"

          if [ ! -s "$OLD_KEYSTORE" ]; then
            echo "::error::Keystore file empty"
            exit 1
          fi

          if ! keytool -list \
            -keystore "$OLD_KEYSTORE" \
            -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Store password or keystore is incorrect"
            exit 1
          fi

          if ! keytool -list \
            -keystore "$OLD_KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Key alias is incorrect"
            exit 1
          fi

          ASCII_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')

          echo "::add-mask::$ASCII_PASSWORD"

          rm -f "$NEW_KEYSTORE"

          keytool -importkeystore \
            -srckeystore "$OLD_KEYSTORE" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$NEW_KEYSTORE" \
            -deststoretype PKCS12 \
            -deststorepass "$ASCII_PASSWORD" \
            -destkeypass "$ASCII_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt

          if [ ! -s "$NEW_KEYSTORE" ]; then
            echo "::error::Compatible signing keystore was not created"
            exit 1
          fi

          echo "SIGNING_STORE_FILE=$NEW_KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$ASCII_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$ASCII_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing key converted successfully"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/virendra/calculator
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/values

          cp index.html android-app/app/src/main/assets/index.html

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'VirendraCalculator'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.virendra.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.virendra.calculator'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                      storeType "PKCS12"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > android-app/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="navy">#173453</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.VirendraCalculator" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#173453</item>
                  <item name="android:navigationBarColor">#173453</item>
                  <item name="android:statusBarColor">#173453</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          test -f icon.png
          cp icon.png android-app/app/src/main/res/drawable/app_icon.png

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.VirendraCalculator"
                  android:label="Virendra Calculator"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/virendra/calculator/MainActivity.java <<'EOF'
          package com.virendra.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setBackgroundColor(Color.WHITE);

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(intent, FILE_CHOOSER);
                              return true;

                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER && filePathCallback != null) {

                      Uri[] results =
                              WebChromeClient.FileChooserParams.parseResult(
                                      resultCode,
                                      data
                              );

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Name APK
        shell: bash
        run: |
          cp \
            android-app/app/build/outputs/apk/release/app-release.apk \
            "Virendra-Calculator-v${APP_VERSION}-release.apk"

          echo "APK_NAME=Virendra-Calculator-v${APP_VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Virendra-Calculator-Release-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90
