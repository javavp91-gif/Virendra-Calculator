name: Publish Virendra Calculator APK Release

# Publish an already-built signed APK immediately when this file is updated,
# or publish the APK from a successful future build.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Virendra Calculator Release APK
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-apk:
    name: Publish latest successful APK
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Select successful APK build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$UPSTREAM_RUN_ID"
          else
            # A newly edited publisher should publish the last good build
            # without waiting for a brand-new Android build.
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build-apk.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful APK build could be found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing artifact from workflow run $RUN_ID"

      - name: Download the signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Virendra-Calculator-Release-APK
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release

      - name: Identify the APK version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release/Virendra-Calculator-v*-release.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one signed APK; found ${#apks[@]}" >&2
            exit 1
          fi
          file="${apks[0]}"
          name="$(basename "$file")"
          version="${name#Virendra-Calculator-v}"
          version="${version%-release.apk}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid APK version: $version" >&2
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Virendra Calculator ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
