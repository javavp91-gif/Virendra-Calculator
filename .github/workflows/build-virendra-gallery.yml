          cat > gallery-app/app/src/main/java/com/virendra/gallery/VirendraDocumentsProvider.java <<'EOF'
          package com.virendra.gallery;

          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import android.provider.DocumentsContract;
          import android.provider.DocumentsProvider;

          import java.io.File;
          import java.io.FileNotFoundException;

          public class VirendraDocumentsProvider extends DocumentsProvider {

              private static final String ROOT = "virendra";
              private static final String HOME = "home";

              @Override public boolean onCreate() {
                  GalleryUtils.root(getContext());
                  return true;
              }

              @Override
              public Cursor queryRoots(String[] projection) {
                  MatrixCursor c = new MatrixCursor(rootCols(projection));
                  MatrixCursor.RowBuilder r = c.newRow();
                  r.add(DocumentsContract.Root.COLUMN_ROOT_ID, ROOT);
                  r.add(DocumentsContract.Root.COLUMN_DOCUMENT_ID, HOME);
                  r.add(DocumentsContract.Root.COLUMN_TITLE, "Virendra Gallery");
                  r.add(DocumentsContract.Root.COLUMN_SUMMARY, "Photos, videos & documents");
                  r.add(DocumentsContract.Root.COLUMN_FLAGS,
                          DocumentsContract.Root.FLAG_SUPPORTS_CREATE |
                          DocumentsContract.Root.FLAG_SUPPORTS_IS_CHILD);
                  r.add(DocumentsContract.Root.COLUMN_MIME_TYPES, "*/*");
                  r.add(DocumentsContract.Root.COLUMN_ICON,
                          android.R.drawable.ic_menu_gallery);
                  return c;
              }

              @Override
              public Cursor queryDocument(String id, String[] projection)
                      throws FileNotFoundException {
                  MatrixCursor c = new MatrixCursor(docCols(projection));
                  add(c, file(id));
                  return c;
              }

              @Override
              public Cursor queryChildDocuments(String parentId, String[] projection,
                                                String sortOrder)
                      throws FileNotFoundException {
                  MatrixCursor c = new MatrixCursor(docCols(projection));
                  File[] a = file(parentId).listFiles();
                  if (a != null) for (File f : a) add(c, f);
                  return c;
              }

              @Override
              public ParcelFileDescriptor openDocument(
                      String id, String mode, CancellationSignal signal)
                      throws FileNotFoundException {
                  return ParcelFileDescriptor.open(file(id), pfdMode(mode));
              }

              @Override
              public String createDocument(String parentId, String mimeType,
                                           String displayName)
                      throws FileNotFoundException {
                  File parent = file(parentId);
                  File f = GalleryUtils.unique(parent, GalleryUtils.clean(displayName));
                  try {
                      if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mimeType)) {
                          if (!f.mkdirs()) throw new Exception();
                      } else {
                          if (!f.createNewFile()) throw new Exception();
                      }
                      return id(f);
                  } catch (Exception e) {
                      throw new FileNotFoundException();
                  }
              }

              @Override
              public void deleteDocument(String id) throws FileNotFoundException {
                  File f = file(id);
                  if (f.equals(GalleryUtils.root(getContext())))
                      throw new FileNotFoundException();
                  GalleryUtils.deleteTree(f);
              }

              @Override
              public String renameDocument(String documentId, String displayName)
                      throws FileNotFoundException {
                  File f = file(documentId);
                  File n = GalleryUtils.unique(
                          f.getParentFile(), GalleryUtils.clean(displayName));
                  if (!f.renameTo(n)) throw new FileNotFoundException();
                  return id(n);
              }

              @Override
              public boolean isChildDocument(String parentId, String documentId) {
                  try {
                      File p = file(parentId);
                      File d = file(documentId);
                      return GalleryUtils.inside(p, d) && !p.equals(d);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void add(MatrixCursor c, File f) {
                  MatrixCursor.RowBuilder r = c.newRow();
                  int flags = DocumentsContract.Document.FLAG_SUPPORTS_RENAME |
                          DocumentsContract.Document.FLAG_SUPPORTS_DELETE;
                  if (f.isDirectory())
                      flags |= DocumentsContract.Document.FLAG_DIR_SUPPORTS_CREATE;
                  else
                      flags |= DocumentsContract.Document.FLAG_SUPPORTS_WRITE;

                  r.add(DocumentsContract.Document.COLUMN_DOCUMENT_ID, id(f));
                  r.add(DocumentsContract.Document.COLUMN_DISPLAY_NAME, f.getName());
                  r.add(DocumentsContract.Document.COLUMN_SIZE,
                          f.isDirectory() ? null : f.length());
                  r.add(DocumentsContract.Document.COLUMN_MIME_TYPE,
                          f.isDirectory()
                                  ? DocumentsContract.Document.MIME_TYPE_DIR
                                  : GalleryUtils.mime(f));
                  r.add(DocumentsContract.Document.COLUMN_LAST_MODIFIED, f.lastModified());
                  r.add(DocumentsContract.Document.COLUMN_FLAGS, flags);
              }

              private File file(String id) throws FileNotFoundException {
                  try {
                      File root = GalleryUtils.root(getContext()).getCanonicalFile();
                      if (HOME.equals(id)) return root;
                      if (!id.startsWith("p:")) throw new FileNotFoundException();
                      File f = new File(root, id.substring(2)).getCanonicalFile();
                      if (!GalleryUtils.inside(root, f)) throw new FileNotFoundException();
                      return f;
                  } catch (Exception e) {
                      throw new FileNotFoundException();
                  }
              }

              private String id(File f) {
                  try {
                      File root = GalleryUtils.root(getContext()).getCanonicalFile();
                      File x = f.getCanonicalFile();
                      if (x.equals(root)) return HOME;
                      return "p:" + x.getPath().substring(root.getPath().length() + 1);
                  } catch (Exception e) {
                      return HOME;
                  }
              }

              private int pfdMode(String mode) {
                  if ("r".equals(mode)) return ParcelFileDescriptor.MODE_READ_ONLY;
                  if ("w".equals(mode) || "wt".equals(mode))
                      return ParcelFileDescriptor.MODE_WRITE_ONLY |
                              ParcelFileDescriptor.MODE_CREATE |
                              ParcelFileDescriptor.MODE_TRUNCATE;
                  if ("wa".equals(mode))
                      return ParcelFileDescriptor.MODE_WRITE_ONLY |
                              ParcelFileDescriptor.MODE_CREATE |
                              ParcelFileDescriptor.MODE_APPEND;
                  return ParcelFileDescriptor.MODE_READ_WRITE |
                          ParcelFileDescriptor.MODE_CREATE;
              }

              private String[] rootCols(String[] p) {
                  return p != null ? p : new String[]{
                          DocumentsContract.Root.COLUMN_ROOT_ID,
                          DocumentsContract.Root.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Root.COLUMN_TITLE,
                          DocumentsContract.Root.COLUMN_SUMMARY,
                          DocumentsContract.Root.COLUMN_FLAGS,
                          DocumentsContract.Root.COLUMN_MIME_TYPES,
                          DocumentsContract.Root.COLUMN_ICON
                  };
              }

              private String[] docCols(String[] p) {
                  return p != null ? p : new String[]{
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_SIZE,
                          DocumentsContract.Document.COLUMN_MIME_TYPE,
                          DocumentsContract.Document.COLUMN_LAST_MODIFIED,
                          DocumentsContract.Document.COLUMN_FLAGS
                  };
              }
          }
