name: Build Virendra Gallery APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare compatible signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"

          OLD_KEYSTORE="$RUNNER_TEMP/virendra-release-original.jks"
          NEW_KEYSTORE="$RUNNER_TEMP/virendra-gallery-compatible.p12"

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$OLD_KEYSTORE"
          test -s "$OLD_KEYSTORE"

          ASCII_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$ASCII_PASSWORD"

          rm -f "$NEW_KEYSTORE"

          keytool -importkeystore \
            -srckeystore "$OLD_KEYSTORE" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$NEW_KEYSTORE" \
            -deststoretype PKCS12 \
            -deststorepass "$ASCII_PASSWORD" \
            -destkeypass "$ASCII_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt

          echo "SIGNING_STORE_FILE=$NEW_KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$ASCII_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$ASCII_PASSWORD" >> "$GITHUB_ENV"

      - name: Create Virendra Gallery Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p gallery-app/app/src/main/java/com/virendra/gallery
          mkdir -p gallery-app/app/src/main/res/values
          mkdir -p gallery-app/app/src/main/res/drawable

          cat > gallery-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'VirendraGallery'
          include ':app'
          EOF

          cat > gallery-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gallery-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.virendra.gallery'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.virendra.gallery'
                  minSdk 24
                  targetSdk 35
                  versionCode 10100
                  versionName '1.1.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                      storeType "PKCS12"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > gallery-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.VirendraGallery" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#173453</item>
                  <item name="android:statusBarColor">#173453</item>
                  <item name="android:navigationBarColor">#173453</item>
              </style>
          </resources>
          EOF

          cat > gallery-app/app/src/main/res/drawable/ic_gallery.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#173453" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M17,23h74v62h-74z"/>
              <path android:fillColor="#9CC6E8" android:pathData="M24,30h60v47h-60z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M29,70l17,-17 11,11 8,-8 14,14z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M68,40a7,7 0,1 0,0.1 0z"/>
          </vector>
          EOF

          cat > gallery-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Virendra Gallery"
                  android:theme="@style/Theme.VirendraGallery"
                  android:icon="@drawable/ic_gallery">

                  <activity
                      android:name=".PickerActivity"
                      android:label="Virendra Gallery"
                      android:exported="true">
                      <!-- This makes Virendra Gallery appear as an app choice
                           in normal Upload / Choose file flows. -->
                      <intent-filter>
                          <action android:name="android.intent.action.GET_CONTENT"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.OPENABLE"/>
                          <data android:mimeType="*/*"/>
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Also exposes the private gallery as a source inside
                       Android's Files/Documents picker. -->
                  <provider
                      android:name=".VirendraDocumentsProvider"
                      android:authorities="com.virendra.gallery.documents"
                      android:exported="true"
                      android:grantUriPermissions="true"
                      android:permission="android.permission.MANAGE_DOCUMENTS">
                      <intent-filter>
                          <action android:name="android.content.action.DOCUMENTS_PROVIDER"/>
                      </intent-filter>
                  </provider>

                  <provider
                      android:name=".VirendraShareProvider"
                      android:authorities="com.virendra.gallery.share"
                      android:exported="false"
                      android:grantUriPermissions="true"/>
              </application>
          </manifest>
          EOF

          cat > gallery-app/app/src/main/java/com/virendra/gallery/GalleryUtils.java <<'EOF'
          package com.virendra.gallery;

          import android.webkit.MimeTypeMap;
          import java.io.File;
          import java.net.URLConnection;
          import java.util.Locale;

          final class GalleryUtils {
              private GalleryUtils() {}

              static File root(android.content.Context c) {
                  File r = new File(c.getFilesDir(), "VirendraGallery");
                  if (!r.exists()) r.mkdirs();
                  new File(r, "Photos").mkdirs();
                  new File(r, "Videos").mkdirs();
                  new File(r, "Documents").mkdirs();
                  return r;
              }

              static String mime(File f) {
                  if (f.isDirectory()) return "vnd.android.document/directory";
                  String t = URLConnection.guessContentTypeFromName(f.getName());
                  if (t != null) return t;
                  String ext = MimeTypeMap.getFileExtensionFromUrl(f.getName());
                  if (ext != null) {
                      t = MimeTypeMap.getSingleton()
                              .getMimeTypeFromExtension(ext.toLowerCase(Locale.ROOT));
                      if (t != null) return t;
                  }
                  return "application/octet-stream";
              }

              static String clean(String s) {
                  if (s == null || s.trim().isEmpty()) return "file";
                  return s.replace("/", "_").replace("\\", "_").replace("..", "_");
              }

              static File unique(File dir, String name) {
                  File f = new File(dir, name);
                  if (!f.exists()) return f;
                  String base = name, ext = "";
                  int dot = name.lastIndexOf('.');
                  if (dot > 0) {
                      base = name.substring(0, dot);
                      ext = name.substring(dot);
                  }
                  int n = 2;
                  while (f.exists()) f = new File(dir, base + " (" + n++ + ")" + ext);
                  return f;
              }

              static boolean inside(File root, File f) {
                  try {
                      String rp = root.getCanonicalPath();
                      String fp = f.getCanonicalPath();
                      return fp.equals(rp) || fp.startsWith(rp + File.separator);
                  } catch (Exception e) {
                      return false;
                  }
              }

              static void deleteTree(File f) {
                  if (f.isDirectory()) {
                      File[] a = f.listFiles();
                      if (a != null) for (File x : a) deleteTree(x);
                  }
                  f.delete();
              }
          }
          EOF

          cat > gallery-app/app/src/main/java/com/virendra/gallery/VirendraShareProvider.java <<'EOF'
          package com.virendra.gallery;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import android.provider.OpenableColumns;

          import java.io.File;
          import java.io.FileNotFoundException;

          public class VirendraShareProvider extends ContentProvider {

              static Uri uriForFile(android.content.Context c, File f) throws Exception {
                  File root = GalleryUtils.root(c).getCanonicalFile();
                  File file = f.getCanonicalFile();
                  if (!GalleryUtils.inside(root, file) || file.isDirectory())
                      throw new SecurityException();
                  String rel = file.getPath().substring(root.getPath().length() + 1);
                  return new Uri.Builder()
                          .scheme("content")
                          .authority("com.virendra.gallery.share")
                          .appendPath(rel)
                          .build();
              }

              private File fileFor(Uri uri) throws FileNotFoundException {
                  try {
                      File root = GalleryUtils.root(getContext()).getCanonicalFile();
                      String rel = uri.getPath();
                      if (rel == null) throw new FileNotFoundException();
                      if (rel.startsWith("/")) rel = rel.substring(1);
                      File f = new File(root, rel).getCanonicalFile();
                      if (!GalleryUtils.inside(root, f) || f.isDirectory())
                          throw new FileNotFoundException();
                      return f;
                  } catch (Exception e) {
                      throw new FileNotFoundException();
                  }
              }

              @Override public boolean onCreate() { return true; }

              @Override public String getType(Uri uri) {
                  try { return GalleryUtils.mime(fileFor(uri)); }
                  catch (Exception e) { return "application/octet-stream"; }
              }

              @Override
              public ParcelFileDescriptor openFile(Uri uri, String mode)
                      throws FileNotFoundException {
                  return ParcelFileDescriptor.open(
                          fileFor(uri), ParcelFileDescriptor.MODE_READ_ONLY);
              }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection,
                                  String[] args, String sort) {
                  String[] cols = projection != null ? projection :
                          new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE};
                  MatrixCursor c = new MatrixCursor(cols);
                  try {
                      File f = fileFor(uri);
                      MatrixCursor.RowBuilder r = c.newRow();
                      for (String col : cols) {
                          if (OpenableColumns.DISPLAY_NAME.equals(col)) r.add(col, f.getName());
                          else if (OpenableColumns.SIZE.equals(col)) r.add(col, f.length());
                          else r.add(col, null);
                      }
                  } catch (Exception ignored) {}
                  return c;
              }

              @Override public Uri insert(Uri uri, ContentValues values) { return null; }
              @Override public int delete(Uri uri, String s, String[] a) { return 0; }
              @Override public int update(Uri uri, ContentValues v, String s, String[] a) { return 0; }
          }
          EOF

          cat > gallery-app/app/src/main/java/com/virendra/gallery/PickerActivity.java <<'EOF'
          package com.virendra.gallery;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.ThumbnailUtils;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.util.Arrays;

          public class PickerActivity extends Activity {

              private File root, dir;
              private LinearLayout list;
              private TextView title;
              private String requestedType = "*/*";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  root = GalleryUtils.root(this);
                  dir = root;

                  String t = getIntent().getType();
                  if (t != null) requestedType = t;

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(12), dp(12), dp(12), dp(12));

                  title = new TextView(this);
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  title.setText("Choose from Virendra Gallery");
                  page.addView(title);

                  LinearLayout bar = new LinearLayout(this);
                  Button back = new Button(this);
                  back.setText("← Back");
                  back.setOnClickListener(v -> {
                      if (!dir.equals(root)) {
                          File p = dir.getParentFile();
                          if (p != null && GalleryUtils.inside(root, p)) dir = p;
                          render();
                      } else finish();
                  });
                  bar.addView(back, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button openApp = new Button(this);
                  openApp.setText("Open Gallery");
                  openApp.setOnClickListener(v ->
                          startActivity(new Intent(this, MainActivity.class)));
                  bar.addView(openApp, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  page.addView(bar);

                  ScrollView scroll = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list);
                  page.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(page);
                  render();
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (list != null) render();
              }

              private int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density);
              }

              private void render() {
                  list.removeAllViews();
                  title.setText("Virendra Gallery • " +
                          (dir.equals(root) ? "Home" : dir.getName()));

                  File[] a = dir.listFiles();
                  if (a == null) return;
                  Arrays.sort(a, (x,y) -> {
                      if (x.isDirectory() != y.isDirectory())
                          return x.isDirectory() ? -1 : 1;
                      return x.getName().compareToIgnoreCase(y.getName());
                  });

                  int shown = 0;
                  for (File f : a) {
                      if (!f.isDirectory() && !accepts(f)) continue;
                      addRow(f);
                      shown++;
                  }

                  if (shown == 0) {
                      TextView e = new TextView(this);
                      e.setText("इस प्रकार की कोई file Virendra Gallery में नहीं है");
                      e.setGravity(Gravity.CENTER);
                      e.setTextSize(16);
                      e.setPadding(0, dp(40), 0, 0);
                      list.addView(e);
                  }
              }

              private boolean accepts(File f) {
                  if ("*/*".equals(requestedType)) return true;
                  String fm = GalleryUtils.mime(f);
                  if (requestedType.endsWith("/*")) {
                      String p = requestedType.substring(0, requestedType.indexOf('/'));
                      return fm.startsWith(p + "/");
                  }
                  return requestedType.equalsIgnoreCase(fm);
              }

              private void addRow(File f) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(6), dp(8), dp(6), dp(8));

                  ImageView im = new ImageView(this);
                  im.setLayoutParams(new LinearLayout.LayoutParams(dp(70), dp(70)));
                  im.setScaleType(ImageView.ScaleType.CENTER_CROP);

                  if (f.isDirectory()) {
                      im.setImageResource(android.R.drawable.ic_menu_agenda);
                  } else {
                      preview(im, f);
                  }
                  row.addView(im);

                  TextView name = new TextView(this);
                  name.setText(f.getName());
                  name.setTextSize(16);
                  name.setPadding(dp(10), 0, 0, 0);
                  row.addView(name, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  row.setOnClickListener(v -> {
                      if (f.isDirectory()) {
                          dir = f;
                          render();
                      } else {
                          choose(f);
                      }
                  });

                  list.addView(row);
              }

              private void preview(ImageView v, File f) {
                  try {
                      String m = GalleryUtils.mime(f);
                      Bitmap b = null;
                      if (m.startsWith("image/")) {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inSampleSize = 4;
                          b = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                      } else if (m.startsWith("video/")) {
                          b = ThumbnailUtils.createVideoThumbnail(
                                  f.getAbsolutePath(),
                                  MediaStore.Video.Thumbnails.MINI_KIND);
                      }
                      if (b != null) {
                          v.setImageBitmap(b);
                          return;
                      }
                  } catch (Exception ignored) {}
                  v.setImageResource(android.R.drawable.ic_menu_save);
              }

              private void choose(File f) {
                  try {
                      Uri uri = VirendraShareProvider.uriForFile(this, f);
                      Intent result = new Intent();
                      result.setData(uri);
                      result.setClipData(android.content.ClipData.newRawUri(f.getName(), uri));
                      result.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      setResult(RESULT_OK, result);
                      finish();
                  } catch (Exception e) {
                      Toast.makeText(this, "File open नहीं हो पाई", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

          cat > gallery-app/app/src/main/java/com/virendra/gallery/MainActivity.java <<'EOF'
          package com.virendra.gallery;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.ThumbnailUtils;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.Arrays;

          public class MainActivity extends Activity {

              private static final int IMPORT = 7001;
              private File root, dir;
              private LinearLayout list;
              private TextView path;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  root = GalleryUtils.root(this);
                  dir = root;

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(12), dp(12), dp(12), dp(12));

                  TextView heading = new TextView(this);
                  heading.setText("Virendra Gallery");
                  heading.setTextSize(28);
                  heading.setGravity(Gravity.CENTER);
                  page.addView(heading);

                  path = new TextView(this);
                  path.setPadding(0, dp(6), 0, dp(6));
                  page.addView(path);

                  LinearLayout bar = new LinearLayout(this);

                  Button back = new Button(this);
                  back.setText("← Back");
                  back.setOnClickListener(v -> {
                      if (!dir.equals(root)) {
                          File p = dir.getParentFile();
                          if (p != null && GalleryUtils.inside(root, p)) dir = p;
                          render();
                      }
                  });
                  bar.addView(back, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button add = new Button(this);
                  add.setText("+ Add");
                  add.setOnClickListener(v -> importFiles());
                  bar.addView(add, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button folder = new Button(this);
                  folder.setText("+ Folder");
                  folder.setOnClickListener(v -> newFolder());
                  bar.addView(folder, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  page.addView(bar);

                  TextView note = new TextView(this);
                  note.setText("Photos • Videos • Documents\n" +
                          "दूसरे app में Upload/Choose file दबाने पर Virendra Gallery चुनें।");
                  note.setGravity(Gravity.CENTER);
                  note.setPadding(0, dp(6), 0, dp(6));
                  page.addView(note);

                  ScrollView scroll = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list);
                  page.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(page);
                  render();
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (list != null) render();
              }

              private int dp(int n) {
                  return (int)(n * getResources().getDisplayMetrics().density);
              }

              private void render() {
                  list.removeAllViews();
                  path.setText(dir.equals(root) ? "Home" : dir.getName());

                  File[] a = dir.listFiles();
                  if (a == null) return;
                  Arrays.sort(a, (x,y) -> {
                      if (x.isDirectory() != y.isDirectory())
                          return x.isDirectory() ? -1 : 1;
                      return x.getName().compareToIgnoreCase(y.getName());
                  });

                  for (File f : a) addRow(f);
              }

              private void addRow(File f) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(5), dp(7), dp(5), dp(7));

                  ImageView im = new ImageView(this);
                  im.setLayoutParams(new LinearLayout.LayoutParams(dp(70), dp(70)));
                  im.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  if (f.isDirectory()) im.setImageResource(android.R.drawable.ic_menu_agenda);
                  else preview(im, f);
                  row.addView(im);

                  LinearLayout middle = new LinearLayout(this);
                  middle.setOrientation(LinearLayout.VERTICAL);
                  middle.setPadding(dp(10), 0, dp(6), 0);

                  TextView name = new TextView(this);
                  name.setText(f.getName());
                  name.setTextSize(16);
                  middle.addView(name);

                  TextView info = new TextView(this);
                  info.setText(f.isDirectory() ? "Folder" :
                          GalleryUtils.mime(f) + " • " + readable(f.length()));
                  info.setTextSize(12);
                  middle.addView(info);

                  LinearLayout actions = new LinearLayout(this);

                  Button share = new Button(this);
                  share.setText(f.isDirectory() ? "Open" : "Share");
                  share.setAllCaps(false);
                  share.setOnClickListener(v -> {
                      if (f.isDirectory()) {
                          dir = f;
                          render();
                      } else share(f);
                  });
                  actions.addView(share);

                  Button del = new Button(this);
                  del.setText("Delete");
                  del.setAllCaps(false);
                  del.setOnClickListener(v -> confirmDelete(f));
                  actions.addView(del);

                  middle.addView(actions);
                  row.addView(middle, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  row.setOnClickListener(v -> {
                      if (f.isDirectory()) {
                          dir = f;
                          render();
                      }
                  });

                  list.addView(row);
              }

              private void preview(ImageView v, File f) {
                  try {
                      String m = GalleryUtils.mime(f);
                      Bitmap b = null;
                      if (m.startsWith("image/")) {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inSampleSize = 4;
                          b = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                      } else if (m.startsWith("video/")) {
                          b = ThumbnailUtils.createVideoThumbnail(
                                  f.getAbsolutePath(),
                                  MediaStore.Video.Thumbnails.MINI_KIND);
                      }
                      if (b != null) {
                          v.setImageBitmap(b);
                          return;
                      }
                  } catch (Exception ignored) {}
                  v.setImageResource(android.R.drawable.ic_menu_save);
              }

              private void importFiles() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  startActivityForResult(i, IMPORT);
              }

              @Override
              protected void onActivityResult(int req, int result, Intent data) {
                  super.onActivityResult(req, result, data);
                  if (req != IMPORT || result != RESULT_OK || data == null) return;

                  ClipData clip = data.getClipData();
                  if (clip != null) {
                      for (int i=0; i<clip.getItemCount(); i++)
                          copyIn(clip.getItemAt(i).getUri());
                  } else if (data.getData() != null) {
                      copyIn(data.getData());
                  }
                  render();
              }

              private void copyIn(Uri uri) {
                  try {
                      ContentResolver cr = getContentResolver();
                      String name = displayName(uri);
                      String mime = cr.getType(uri);
                      if (mime == null) mime = "application/octet-stream";

                      File target = dir;
                      if (dir.equals(root)) {
                          if (mime.startsWith("image/")) target = new File(root, "Photos");
                          else if (mime.startsWith("video/")) target = new File(root, "Videos");
                          else target = new File(root, "Documents");
                      }
                      target.mkdirs();

                      File out = GalleryUtils.unique(target, GalleryUtils.clean(name));
                      try (InputStream in = cr.openInputStream(uri);
                           FileOutputStream fos = new FileOutputStream(out)) {
                          if (in == null) throw new Exception();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) fos.write(buf, 0, n);
                      }
                      Toast.makeText(this, "Added ✓", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Add नहीं हुआ", Toast.LENGTH_SHORT).show();
                  }
              }

              private String displayName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri,
                              new String[]{OpenableColumns.DISPLAY_NAME},
                              null, null, null);
                      if (c != null && c.moveToFirst()) return c.getString(0);
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return "file_" + System.currentTimeMillis();
              }

              private void newFolder() {
                  EditText input = new EditText(this);
                  input.setHint("Folder name");
                  new AlertDialog.Builder(this)
                          .setTitle("New Folder")
                          .setView(input)
                          .setPositiveButton("Create", (d,w) -> {
                              String n = GalleryUtils.clean(
                                      input.getText().toString().trim());
                              new File(dir, n).mkdirs();
                              render();
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void share(File f) {
                  try {
                      Uri u = VirendraShareProvider.uriForFile(this, f);
                      Intent s = new Intent(Intent.ACTION_SEND);
                      s.setType(GalleryUtils.mime(f));
                      s.putExtra(Intent.EXTRA_STREAM, u);
                      s.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(s, "Share"));
                  } catch (Exception e) {
                      Toast.makeText(this, "Share नहीं हुआ", Toast.LENGTH_SHORT).show();
                  }
              }

              private void confirmDelete(File f) {
                  new AlertDialog.Builder(this)
                          .setTitle("Delete?")
                          .setMessage(f.getName())
                          .setPositiveButton("Delete", (d,w) -> {
                              GalleryUtils.deleteTree(f);
                              render();
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private String readable(long b) {
                  if (b < 1024) return b + " B";
                  if (b < 1024*1024) return String.format("%.1f KB", b/1024.0);
                  return String.format("%.1f MB", b/1024.0/1024.0);
              }
          }
