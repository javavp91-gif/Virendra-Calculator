name: Prepare Virendra Calculator Auto APK Update Files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-auto-apk-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Make native auto-update changes safely
        shell: bash
        run: |
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import json

          file = Path('.github/workflows/build-apk.yml')
          s = file.read_text(encoding='utf-8')
          already_configured = 'APK_AUTO_PREFS = "virendra_apk_auto"' in s
          if 'APK_AUTO_PREFS = "virendra_apk_auto"' in s:
              print('Automatic APK download is already configured. No duplicate patch.')
          else:
              def replace_once(before, after, label):
                  global s
                  n = s.count(before)
                  if n != 1:
                      raise SystemExit(f'{label}: expected one match, found {n}; nothing saved.')
                  s = s.replace(before, after, 1)

              replace_once('          import android.app.Activity;\n',
                  '          import android.app.Activity;\n'
                  '          import android.app.DownloadManager;\n'
                  '          import android.content.BroadcastReceiver;\n'
                  '          import android.content.Context;\n'
                  '          import android.content.IntentFilter;\n'
                  '          import android.database.Cursor;\n'
                  '          import android.os.Environment;\n'
                  '          import android.provider.Settings;\n', 'Java imports')
              replace_once('              <uses-permission android:name="android.permission.INTERNET"/>',
                  '              <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',
                  'Installer permission')

              replace_once('              private Uri cameraImageUri;\n', '''              private Uri cameraImageUri;

                    private static final String APK_VERSION_URL =
                            "https://javavp91-gif.github.io/Virendra-Calculator/apk-version.txt";
                    private static final String APK_DOWNLOAD_URL =
                            "https://javavp91-gif.github.io/Virendra-Calculator/Virendra-Calculator-latest.apk";
                    private static final String APK_AUTO_PREFS = "virendra_apk_auto";
                    private boolean apkReceiverRegistered = false;
                    private boolean appInForeground = false;

                    private final BroadcastReceiver apkDownloadReceiver = new BroadcastReceiver() {
                        @Override public void onReceive(Context context, Intent intent) {
                            if (!DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(intent.getAction())) return;
                            long completed = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                            SharedPreferences prefs = getSharedPreferences(APK_AUTO_PREFS, MODE_PRIVATE);
                            if (completed > 0 && completed == prefs.getLong("download_id", -1L)) {
                                maybeOpenApkInstaller();
                            }
                        }
                    };
          ''', 'Native APK fields')
              replace_once('                  showNativeSplash();\n\n                  new Handler', '''                  showNativeSplash();
                            IntentFilter completed = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                            if (Build.VERSION.SDK_INT >= 33) {
                                registerReceiver(apkDownloadReceiver, completed, Context.RECEIVER_EXPORTED);
                            } else {
                                registerReceiver(apkDownloadReceiver, completed);
                            }
                            apkReceiverRegistered = true;

                            new Handler''', 'Download completion receiver')

              start = s.find('                        private void checkForApkUpdate() {')
              stop = s.find('    private String getInstalledVersion() {', start)
              if start < 0 or stop <= start + 1000:
                  raise SystemExit('Native update method changed; aborting for safety.')
              new_method = r'''          // Regular index.html tools update quietly, as before.
                    // New native APK files download automatically; Android controls installation.
                    private void checkForApkUpdate() {
                        HttpURLConnection connection = null;
                        try {
                            connection = (HttpURLConnection) new URL(APK_VERSION_URL +
                                    "?t=" + System.currentTimeMillis()).openConnection();
                            connection.setConnectTimeout(7000);
                            connection.setReadTimeout(7000);
                            connection.setUseCaches(false);
                            if (connection.getResponseCode() != 200) return;
                            String version = readText(connection.getInputStream()).trim();
                            if (!version.matches("[0-9]+\\.[0-9]+\\.[0-9]+")) return;
                            if (compareVersions(version, getInstalledVersion()) <= 0) return;
                            runOnUiThread(() -> ensureLatestApkDownloaded(version));
                        } catch (Exception ignored) {
                            // Offline: normal app and cached tools keep working.
                        } finally {
                            if (connection != null) connection.disconnect();
                        }
                    }

                    private int apkDownloadStatus(DownloadManager manager, long id) {
                        if (id <= 0) return -1;
                        try (Cursor cursor = manager.query(
                                new DownloadManager.Query().setFilterById(id))) {
                            if (cursor != null && cursor.moveToFirst()) {
                                return cursor.getInt(cursor.getColumnIndexOrThrow(
                                        DownloadManager.COLUMN_STATUS));
                            }
                        } catch (Exception ignored) {}
                        return -1;
                    }

                    private void ensureLatestApkDownloaded(String version) {
                        if (isFinishing() || isDestroyed()) return;
                        try {
                            DownloadManager manager =
                                    (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                            if (manager == null) return;
                            SharedPreferences prefs = getSharedPreferences(APK_AUTO_PREFS, MODE_PRIVATE);
                            long previousId = prefs.getLong("download_id", -1L);
                            String previousVersion = prefs.getString("download_version", "");
                            int status = apkDownloadStatus(manager, previousId);
                            if (version.equals(previousVersion)) {
                                if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                    maybeOpenApkInstaller();
                                    return;
                                }
                                if (status == DownloadManager.STATUS_PENDING ||
                                        status == DownloadManager.STATUS_RUNNING ||
                                        status == DownloadManager.STATUS_PAUSED) return;
                            }
                            DownloadManager.Request request = new DownloadManager.Request(
                                    Uri.parse(APK_DOWNLOAD_URL + "?v=" + Uri.encode(version)));
                            request.setTitle("Virendra Calculator v" + version);
                            request.setDescription("नया APK अपने-आप डाउनलोड हो रहा है");
                            request.setMimeType("application/vnd.android.package-archive");
                            request.setNotificationVisibility(
                                    DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                            request.setDestinationInExternalFilesDir(
                                    this, Environment.DIRECTORY_DOWNLOADS,
                                    "Virendra-Calculator-v" + version + "-release.apk");
                            long id = manager.enqueue(request);
                            prefs.edit().putLong("download_id", id)
                                    .putString("download_version", version)
                                    .remove("permission_requested_version")
                                    .apply();
                        } catch (Exception ignored) {
                            // Never show the old-style Update/Later popup on download error.
                        }
                    }

                    private void maybeOpenApkInstaller() {
                        if (!appInForeground || isFinishing() || isDestroyed()) return;
                        try {
                            SharedPreferences prefs = getSharedPreferences(APK_AUTO_PREFS, MODE_PRIVATE);
                            long id = prefs.getLong("download_id", -1L);
                            String version = prefs.getString("download_version", "");
                            if (id <= 0 || version.isEmpty() ||
                                    compareVersions(version, getInstalledVersion()) <= 0 ||
                                    version.equals(prefs.getString("installer_shown_version", ""))) return;
                            DownloadManager manager = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                            if (manager == null ||
                                    apkDownloadStatus(manager, id) != DownloadManager.STATUS_SUCCESSFUL)
                                return;
                            Uri apk = manager.getUriForDownloadedFile(id);
                            if (apk == null) return;

                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                                    !getPackageManager().canRequestPackageInstalls()) {
                                if (!version.equals(prefs.getString("permission_requested_version", ""))) {
                                    prefs.edit().putString("permission_requested_version", version).apply();
                                    Intent permission = new Intent(
                                            Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                            Uri.parse("package:" + getPackageName()));
                                    startActivity(permission);
                                }
                                return;
                            }

                            Intent install = new Intent(Intent.ACTION_VIEW);
                            install.setDataAndType(apk, "application/vnd.android.package-archive");
                            install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                            prefs.edit().putString("installer_shown_version", version).apply();
                            startActivity(install);
                        } catch (Exception ignored) {
                            // Completed APK is also available through Android Downloads.
                        }
                    }

                    @Override
                    protected void onResume() {
                        super.onResume();
                        appInForeground = true;
                        maybeOpenApkInstaller();
                    }

                    @Override
                    protected void onPause() {
                        appInForeground = false;
                        super.onPause();
                    }

          '''
              s = s[:start] + new_method + s[stop:]
              replace_once('                  super.onDestroy();\n', '''                  if (apkReceiverRegistered) {
                                unregisterReceiver(apkDownloadReceiver);
                                apkReceiverRegistered = false;
                            }
                            super.onDestroy();
          ''', 'Cleanup')
              if 'New Version Available' in s or 'releases/download/v' in s:
                  raise SystemExit('Old native update dialog/link still found, aborting.')
              file.write_text(s, encoding='utf-8')
              print('Patched native APK auto download; preserved existing content auto update.')

          # One-time native upgrade: current installed v1.1.116 cannot change its own Java code.
          version_path = Path('version.json')
          data = json.loads(version_path.read_text(encoding='utf-8'))
          if not already_configured:
              numbers = [int(x) for x in data.get('version', '1.1.116').split('.')]
              if len(numbers) != 3:
                  raise SystemExit('Unexpected version.json version')
              numbers[2] += 1
              data['version'] = '.'.join(map(str, numbers))
              data['notes'] = 'Automatic content updates; native APK auto-download with Android install confirmation.'
              version_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('Set one-time new native version:', data['version'])
          PY_PATCH
      - name: Prepare corrected files for owner upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ready-upload
          cp .github/workflows/build-apk.yml ready-upload/build-apk.yml
          cp version.json ready-upload/version.json
          test -s ready-upload/build-apk.yml
          test -s ready-upload/version.json
          if ! grep -q 'APK_AUTO_PREFS = "virendra_apk_auto"' ready-upload/build-apk.yml; then
            echo 'Automatic native APK update patch was not applied' >&2
            exit 1
          fi
          python3 -c 'import json; print("Ready version:",json.load(open("ready-upload/version.json"))["version"])'

      - name: Download these files and upload through GitHub website
        uses: actions/upload-artifact@v4
        with:
          name: Virendra-Auto-Update-Ready-Files
          path: ready-upload/
          if-no-files-found: error
          retention-days: 7
